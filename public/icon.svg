<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162435"/>
      <stop offset="1" stop-color="#080e15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0.1" y1="1" x2="0.95" y2="0.05">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.4" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="mane" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- Everything inside #mark is extracted by scripts/make-icon.mjs into
       public/logo-mark.svg, the plate-free version used inside the app UI. -->
  <g id="mark">
    <!-- mane, sitting behind the head -->
    <path d="M250 132 C176 176 126 268 116 366 C110 420 112 450 116 474
             L 156 452 L 176 474 L 208 448 L 226 474
             C 210 380 216 286 262 210 Z" fill="url(#mane)"/>

    <!-- far ear -->
    <path d="M244 176 C230 132 220 100 214 66 C250 96 280 138 296 178
             C 278 172 260 172 244 176 Z" fill="#2f8fd8"/>
    <!-- near ear -->
    <path d="M296 172 C296 122 304 82 318 48 C338 90 344 138 336 186
             C 324 176 310 171 296 172 Z" fill="#5ecdf5"/>

    <!-- head, snout and neck -->
    <path d="M282 146
             C330 154 372 190 394 232
             C412 266 410 296 392 306
             C374 316 350 310 336 296
             C326 286 318 292 308 306
             C294 326 286 350 280 376
             C272 414 268 444 266 476
             L182 476
             C172 408 178 322 202 262
             C222 210 246 168 282 146 Z" fill="url(#fur)"/>

    <!-- circuit traces -->
    <g stroke="#cffafe" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M286 198 L328 198 L348 220"/>
      <path d="M232 320 L268 320"/>
      <path d="M252 390 L252 422 L228 446"/>
    </g>
    <g fill="#ecfeff">
      <circle cx="352" cy="224" r="12"/>
      <circle cx="226" cy="320" r="11"/>
      <circle cx="224" cy="450" r="12"/>
    </g>

    <!-- eye and nostril -->
    <path d="M318 224 C332 214 352 216 362 228 C350 240 328 240 318 224 Z" fill="#08111a"/>
    <circle cx="339" cy="226" r="7" fill="#ecfeff"/>
    <ellipse cx="384" cy="282" rx="10" ry="8" fill="#08111a" opacity="0.8"/>
  </g>
</svg>
